<div class="header-actions">
  <div>
    <h3>Gestión de Reservas</h3>
    <p class="subtitle">Administra los apartados y reservas de los clientes.</p>
  </div>
</div>

<div class="notification-toast" *ngIf="notificationMessage">
  {{ notificationMessage }}
</div>

<div class="table-container">
  <div *ngIf="isLoading" class="loading-state">Cargando reservas...</div>
  
  <table *ngIf="!isLoading">
    <thead>
      <tr>
        <th>N° Reserva</th>
        <th>Cliente</th>
        <th>Total</th>
        <th>Estado</th>
        <th width="200">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of reservas">
        <td class="text-muted font-bold">#RES-{{ r.id }}</td>
        <td>{{ r.cliente?.nombre || 'Cliente Desconocido' }}</td>
        <td class="font-bold text-primary">Bs. {{ r.total_reserva }}</td>
        <td><span [ngClass]="getEstadoClass(r.estado)">{{ r.estado }}</span></td>
        <td>
          <div class="action-buttons">
            <button class="btn-edit" *ngIf="r.estado === 'Pendiente'" (click)="cambiarEstado(r, 'Preparada')">Preparar</button>
            <button class="btn-edit text-success" *ngIf="r.estado === 'Preparada'" (click)="cambiarEstado(r, 'Completada')">Completar</button>
            <button class="btn-delete" *ngIf="r.estado === 'Pendiente' || r.estado === 'Preparada'" (click)="cambiarEstado(r, 'Cancelada')">Cancelar</button>
          </div>
        </td>
      </tr>
      <tr *ngIf="reservas.length === 0">
        <td colspan="5" class="empty-state">No hay reservas registradas.</td>
      </tr>
    </tbody>
  </table>
</div>
