<div class="header-actions">
  <div>
    <h3>Gestión de Colecciones</h3>
    <p class="subtitle">Administra las colecciones de la tienda (Ej. Primavera 2026).</p>
  </div>
  <button class="btn-primary" (click)="openModal()">+ Nueva Colección</button>
</div>

<div class="table-container">
  <div *ngIf="isLoading" class="loading-state">Cargando colecciones...</div>
  
  <table *ngIf="!isLoading">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre de la Colección</th>
        <th width="150">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of colecciones">
        <td class="text-muted">#{{ c.id }}</td>
        <td class="font-bold">{{ c.nombre }}</td>
        <td>
          <div class="action-buttons">
            <button class="btn-edit" (click)="editColeccion(c)">Editar</button>
            <button class="btn-delete" (click)="deleteColeccion(c.id)">Eliminar</button>
          </div>
        </td>
      </tr>
      <tr *ngIf="colecciones.length === 0">
        <td colspan="3" class="empty-state">No hay colecciones registradas en el sistema.</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal-overlay" *ngIf="showModal">
  <div class="modal-content glass-card">
    <div class="modal-header">
      <h3>{{ editingId ? 'Editar Colección' : 'Crear Colección' }}</h3>
      <button class="btn-close" (click)="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="input-group">
        <label>Nombre de la Colección</label>
        <input type="text" class="input-field" placeholder="Ej. Cyberpunk Edition" [(ngModel)]="nuevaColeccion.nombre">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" (click)="closeModal()">Cancelar</button>
      <button class="btn-primary" (click)="guardarColeccion()" [disabled]="isSaving || !nuevaColeccion.nombre">
        {{ isSaving ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </div>
</div>
